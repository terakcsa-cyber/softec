global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: vuln-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["api:4001"]
    bearer_token_file: /etc/prometheus/metrics_bearer

  - job_name: vuln-ai
    static_configs:
      - targets: ["ai:9090"]

  - job_name: vuln-ingest
    static_configs:
      - targets: ["ingest:9091"]
