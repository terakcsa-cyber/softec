# Legacy override — no longer required.
# Host git checkout + docker.sock for in-app updates are baked into
# infra/docker-compose.prod.yml and infra/docker-compose.staging.yml.
#
# Keeping this file so old docs/scripts that pass
#   -f infra/docker-compose.update-helper.yml
# still work (idempotent env/volume merge).

services:
  api:
    environment:
      PLATFORM_REPO_DIR: /host-repo
      PLATFORM_HOST_REPO_PATH: ${PLATFORM_HOST_REPO_PATH:-}
      PLATFORM_UPDATE_APPLY_ENABLED: ${PLATFORM_UPDATE_APPLY_ENABLED:-true}
    volumes:
      - ..:/host-repo
      - /var/run/docker.sock:/var/run/docker.sock
