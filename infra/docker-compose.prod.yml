name: vuln-intel-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Docker default /dev/shm is 64MB — Postgres parallel/hash ops hit ENOSPC (code 53100).
    shm_size: "256mb"
    command:
      [
        "postgres",
        "-c", "max_connections=100",
        "-c", "wal_compression=on",
        "-c", "autovacuum_vacuum_scale_factor=0.05",
        "-c", "autovacuum_analyze_scale_factor=0.02",
        "-c", "autovacuum_naptime=30s",
        "-c", "autovacuum_vacuum_cost_delay=2ms",
        "-c", "max_parallel_workers_per_gather=0",
        "-c", "max_parallel_workers=2",
        "-c", "max_worker_processes=4"
      ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vuln_intel}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        PLATFORM_GIT_SHA: ${PLATFORM_GIT_SHA:-}
        PLATFORM_GIT_BRANCH: ${PLATFORM_GIT_BRANCH:-}
        PLATFORM_GIT_TAG: ${PLATFORM_GIT_TAG:-}
    restart: unless-stopped
    env_file:
      - path: ${APP_ENV_FILE:-../.env.production}
        required: false
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      PORT: 4001
      TLS_CERTS_DIR: /certs
      TLS_PROXY_ADMIN_URL: http://tls-proxy:2019
      TLS_ACME_WEBROOT: /var/www/certbot
      CERTBOT_CONFIG_DIR: /data/letsencrypt
      WEB_TLS_PUBLISHED_PORT: ${WEB_TLS_PUBLISHED_PORT:-443}
      # In-app updates (Settings → Обновления): mount host git checkout + docker.sock.
      # PLATFORM_REPO_DIR is fixed inside the container; host path is auto-detected from the mount
      # when PLATFORM_HOST_REPO_PATH is empty (deploy.sh still writes the absolute path).
      PLATFORM_REPO_DIR: /host-repo
      PLATFORM_HOST_REPO_PATH: ${PLATFORM_HOST_REPO_PATH:-}
      PLATFORM_UPDATE_REPO_URL: ${PLATFORM_UPDATE_REPO_URL:-}
      PLATFORM_UPDATE_BRANCH: ${PLATFORM_UPDATE_BRANCH:-main}
      PLATFORM_UPDATE_APPLY_ENABLED: ${PLATFORM_UPDATE_APPLY_ENABLED:-true}
      PLATFORM_UPDATE_BACKUP: ${PLATFORM_UPDATE_BACKUP:-true}
      PLATFORM_UPDATE_ENV_FILE: ${PLATFORM_UPDATE_ENV_FILE:-.env.production}
      PLATFORM_UPDATE_COMPOSE_FILE: ${PLATFORM_UPDATE_COMPOSE_FILE:-infra/docker-compose.prod.yml}
      PLATFORM_GIT_SHA: ${PLATFORM_GIT_SHA:-}
      PLATFORM_GIT_BRANCH: ${PLATFORM_GIT_BRANCH:-}
      PLATFORM_GIT_TAG: ${PLATFORM_GIT_TAG:-}
    volumes:
      - tls_certs:/certs
      - acme_webroot:/var/www/certbot
      - letsencrypt_data:/data/letsencrypt
      # compose file lives in infra/ → .. is the git repo root on the host
      - ..:/host-repo
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 30

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ${APP_ENV_FILE:-../.env.production}
        required: false
    environment:
      NODE_ENV: production
      WEB_HOST: 0.0.0.0
      WEB_PORT: 3000
      UPSTREAM_API_BASE: http://api:4001/api
    ports:
      - "${WEB_PUBLISHED_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30

  tls-proxy:
    build:
      context: ./tls-proxy
    restart: unless-stopped
    environment:
      TLS_CERTS_DIR: /certs
    volumes:
      - tls_certs:/certs
      - acme_webroot:/var/www/certbot
    ports:
      - "${WEB_TLS_PUBLISHED_PORT:-443}:443"
      - "${WEB_TLS_HTTP_PORT:-80}:80"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:2019/config/ >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  ingest:
    build:
      context: ..
      dockerfile: apps/ingest/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ${APP_ENV_FILE:-../.env.production}
        required: false
    environment:
      NODE_ENV: production
      BDU_ALLOW_MIRROR_FALLBACK: ${BDU_ALLOW_MIRROR_FALLBACK:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy

  libretranslate:
    build:
      context: ./translate-proxy
    image: vuln-intel-translate-proxy:local
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      HOST: 0.0.0.0
      PORT: 5000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/languages', timeout=3)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  ai:
    build:
      context: ..
      dockerfile: apps/ai/Dockerfile
    # Exit 0 when both workers idle (inline defaults); do not loop-restart.
    # Keep process: AI_KEEP_IDLE_PROCESS=true. Crash (exit≠0) still restarts.
    restart: on-failure
    env_file:
      - path: ${APP_ENV_FILE:-../.env.production}
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      libretranslate:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
  tls_certs:
  acme_webroot:
  letsencrypt_data:
