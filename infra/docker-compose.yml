name: vuln-intel

services:
  postgres:
    image: postgres:16-alpine
    command:
      [
        "postgres",
        "-c", "max_connections=200",
        "-c", "wal_compression=on",
        "-c", "autovacuum_vacuum_scale_factor=0.05",
        "-c", "autovacuum_analyze_scale_factor=0.02",
        "-c", "autovacuum_naptime=30s",
        "-c", "autovacuum_vacuum_cost_delay=2ms"
      ]
    environment:
      POSTGRES_USER: vuln
      POSTGRES_PASSWORD: vuln
      POSTGRES_DB: vuln_intel
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vuln -d vuln_intel"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: vuln
      RABBITMQ_DEFAULT_PASS: vuln
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # LibreTranslate-compatible translate API on host :5050 (5000 busy on macOS AirPlay).
  # Uses MyMemory bridge while Argos CDN (argos-net.com) is too slow/unreachable for model downloads.
  # To switch back to official offline LibreTranslate: restore libretranslate/libretranslate image + models volume.
  libretranslate:
    build:
      context: ./translate-proxy
    image: vuln-intel-translate-proxy:local
    restart: unless-stopped
    ports:
      - "5050:5000"
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      # Optional: raises MyMemory daily quota
      # MYMEMORY_EMAIL: you@example.com
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/languages', timeout=3)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:

