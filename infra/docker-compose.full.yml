name: vuln-intel

services:
  postgres:
    image: postgres:16-alpine
    shm_size: "256mb"
    environment:
      POSTGRES_USER: vuln
      POSTGRES_PASSWORD: vuln
      POSTGRES_DB: vuln_intel
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vuln -d vuln_intel"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: vuln
      RABBITMQ_DEFAULT_PASS: vuln
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://vuln:vuln@postgres:5432/vuln_intel
      RABBITMQ_URL: amqp://vuln:vuln@rabbitmq:5672/
      REDIS_URL: redis://redis:6379
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingest:
    build:
      context: ..
      dockerfile: apps/ingest/Dockerfile
    environment:
      DATABASE_URL: postgres://vuln:vuln@postgres:5432/vuln_intel
      RABBITMQ_URL: amqp://vuln:vuln@rabbitmq:5672/
      NVD_API_KEY: ${NVD_API_KEY:-}
      NVD_POLL_INTERVAL_MS: 900000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai:
    build:
      context: ..
      dockerfile: apps/ai/Dockerfile
    environment:
      DATABASE_URL: postgres://vuln:vuln@postgres:5432/vuln_intel
      RABBITMQ_URL: amqp://vuln:vuln@rabbitmq:5672/
      REDIS_URL: redis://redis:6379
      LLM_ENDPOINT: ${LLM_ENDPOINT:-https://api.openai.com/v1/chat/completions}
      LLM_API_KEY: ${LLM_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      LLM_PROMPT_VERSION: ${LLM_PROMPT_VERSION:-v1}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:

