name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (shared core)
        run: pnpm test

      - name: Audit (no high/critical)
        run: pnpm audit:high

      - name: Lint (zero warnings)
        run: pnpm lint

      - name: Install Semgrep
        run: pip install semgrep

      - name: SAST (pnpm audit + Semgrep)
        run: pnpm security:sast
        continue-on-error: true

      - name: Install Playwright browsers
        run: pnpm --filter @vuln-intel/web exec playwright install chromium --with-deps
        continue-on-error: true

      - name: E2E (optional — set E2E_* secrets in CI for full run)
        run: pnpm test:e2e
        continue-on-error: true
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_VIEWER_EMAIL: ${{ secrets.E2E_VIEWER_EMAIL }}
          E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Integration tests (testcontainers)
        run: pnpm test:integration
        env:
          CI: "true"

  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: DAST smoke (offline probes)
        run: pnpm security:dast
        continue-on-error: true
